contract_version: 1
run_id: xmachines-2026-09-25
project: agjassist-xmachines
north_star_ref: xmachines/projcore-run-2026-09-25/north-star.md
stamped_by: agj                              # north author session (also the consult handle)
stamped_at: 2026-09-25T09:54:49+00:00

# planning_criticality: high (carried in the briefing packet). Remote power-off is irreversible +
# tunnel-exposed → requirements review engaged; red-team on architecturally-significant batches.

requirements_reviewers:                      # ENGAGED (high criticality) — run BEFORE planning
  - { model: grok,   launch: "grok --always-approve" }   # NO -m: tracks the CLI default
  - { model: sol,    launch: "codex -m gpt-5.6-sol -c model_reasoning_effort=\"xhigh\" --dangerously-bypass-approvals-and-sandbox" }

plan_reviewers:                              # ALWAYS — gates Tiller (file-based PLAN-READY → plan-approval.md)
  - { model: sol,    launch: "codex -m gpt-5.6-sol -c model_reasoning_effort=\"xhigh\" --dangerously-bypass-approvals-and-sandbox" }

co_planners:                                 # EXACTLY 2 — "planner = sol + opus"
  - { id: A, model: opus5, launch: "claude --dangerously-skip-permissions --model claude-opus-5" }
  - { id: B, model: sol,   launch: "codex -m gpt-5.6-sol -c model_reasoning_effort=\"xhigh\" --dangerously-bypass-approvals-and-sandbox" }

implementer:                                 # tiered — pre-routed per batch via impl_tier
  L1: { model: glimmer, launch: "grok --always-approve -m glimmer-pipe" }   # muse-glimmer-30b · LOCAL/unmetered · meter_shim :8427 -> .179
  L2: { model: grok47,  launch: "grok --always-approve -m grok-4.7" }
  L3: { model: sonnet5, launch: "claude --dangerously-skip-permissions --model claude-sonnet-5" }

validator:                                   # tiered (verifier ≠ fixer at every tier)
  L1: { model: signal,  launch: "grok --always-approve -m signal4500-174" } # signal-27b-4500 · LOCAL/unmetered · .174:8110  (⚠ O3: confirm capable)
  L2: { model: codex55, launch: "codex -m gpt-5.5 --dangerously-bypass-approvals-and-sandbox" }
  L3: { model: opus5,   launch: "claude --dangerously-skip-permissions --model claude-opus-5" }
  # No L4: sol was the only L4 and is now planner-only. L4 is optional/additive — omitted.

deliberation_panel:                          # planning-stage front gate (HIGH → convene only on JROM approval)
  convergence: strict-unanimous
  max_rounds: 3
  settle: [opus5, sol]
  panelists:
    - { model: opus,    profile: agj-panelist }
    - { model: sol,     profile: agj-panelist }
    - { model: sonnet,  profile: agj-panelist }
    - { model: grok45,  profile: agj-panelist }

redteam_panel:                               # impl-stage diff-level back gate — the ONLY seats that did not co-plan
  convergence: bounded-clean
  N: 3                                        # hard round cap (bounded-clean: ≥1 clean · typical 2 · cap 3)
  min_clean_rounds: 1
  typical_rounds: 2
  max_rounds: 3
  at_cap: settle-and-agree
  consecutive_clean_requires_jrom_approval_at_discovery: true
  tiers:
    budget:   { count: 3, models: [grok45, luna, sonnet] }
    standard: { count: 3, models: [opus, terra, grok45] }
    elite:    { count: 6, models: [opus, codex55, sonnet, terra, grok45, grokcompose] }

routing_notes:
  default_impl_tier: L1                       # target 90-95% landing on glimmer
  default_validator_tier: L2
  usage_hygiene: "impl-L1 (glimmer) + validator-L1 (signal) are LOCAL + UNMETERED — prefer them; agent-usage.sh governs only metered seats (grok47/sonnet5/opus5/codex55/sol). OPERATIONAL: local seats need their GPU boxes UP — this effort controls machine power, so never power off .179 (glimmer) or .174 (signal) while the run is live."

coordinator:                                 # escalation-brain seat = grok47 (JROM override of the Opus default)
  primary: { model: grok47, launch: "grok --always-approve --agent projcore -m grok-4.7" }
  backups:
    - { model: sonnet, launch: "claude --dangerously-skip-permissions --model sonnet" }
