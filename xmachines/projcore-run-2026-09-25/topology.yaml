  # here so no future routing weakens it.

deliberation_panel:                          # planning-stage (not used in remaining execution)
  convergence: strict-unanimous
  max_rounds: 3
  settle: [opus5, sonnet5]                    # was [opus5, sol]; sol (codex) → sonnet5 to keep two DISTINCT arbiters
  panelists:
    - { model: opus,    profile: agj-panelist }
    - { model: sonnet,  profile: agj-panelist }   # (was sol/codex — dropped; panel stays cross-family Claude+grok)
    - { model: grok45,  profile: agj-panelist }

